<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Worker OT Calculator</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f5f7;color:#111827}main{max-width:720px;margin:auto;padding:16px}h1{margin:0 0 4px;font-size:24px}.muted{color:#6b7280;font-size:13px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:600}input,select,button{width:100%;min-height:46px;margin-top:5px;padding:10px;border:1px solid #ccc;border-radius:10px;font:inherit}button{background:#111827;color:white;border:0;font-weight:700}.secondary{background:#e9ebef;color:#111827}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#f7f8fa;padding:12px;border-radius:12px}.stat small{display:block;color:#6b7280}.stat b{font-size:20px}.record{border-top:1px solid #eee;padding:12px 0}.actions{display:flex;gap:8px}.actions button{min-height:38px}.danger{background:#fee2e2;color:#991b1b}@media(max-width:480px){.grid,.stats{grid-template-columns:1fr}.full{grid-column:1/-1}}</style></head><body><main><h1>Worker OT Calculator</h1><div class="muted">Normal shift: 9:00 AM – 6:00 PM</div><section class="card"><div class="grid"><label>Worker<select id="worker"></select></label><label>Date<input id="date" type="date"></label><label>In Time<input id="in" type="time" value="09:00"></label><label>Out Time<input id="out" type="time" value="18:00"></label><label>Break (minutes)<input id="br" type="number" min="0" value="0"></label><label>Normal Hours<input value="9h 00m" readonly></label></div><div class="stats"><div class="stat"><small>Worked</small><b id="worked">9h 00m</b></div><div class="stat"><small>Late</small><b id="late">0h 00m</b></div><div class="stat"><small>OT</small><b id="ot">0h 00m</b></div></div><button id="save" style="margin-top:12px">Save Attendance</button></section><section class="card"><div class="grid"><label>New Worker<input id="neww" placeholder="e.g. Ramesh"></label><div><button id="add" class="secondary">+ Add Worker</button></div><div class="full"><button id="csv" class="secondary">Export CSV</button></div></div></section><section class="card"><b>Monthly Summary</b><div class="stats"><div class="stat"><small>Days</small><b id="days">0</b></div><div class="stat"><small>Total Hours</small><b id="mh">0h 00m</b></div><div class="stat"><small>Total OT</small><b id="mo">0h 00m</b></div></div></section><section class="card"><b>Attendance History</b><div id="history"></div></section></main><script>
var R=JSON.parse(localStorage.getItem('ot_records')||'[]'),W=JSON.parse(localStorage.getItem('ot_workers')||'["Worker 1"]');
function $(x){return document.getElementById(x)}function m(t){if(!t)return null;var a=t.split(':');return +a[0]*60+(+a[1])}function f(n){n=Math.max(0,Math.round(n));return Math.floor(n/60)+'h '+String(n%60).padStart(2,'0')+'m'}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fill(){ $('worker').innerHTML=W.map(function(x){return '<option>'+esc(x)+'</option>'}).join('') }
function calc(){var a=m($('in').value),b=m($('out').value),br=Math.max(0,+$('br').value||0);if(a==null||b==null)return;if(b<=a)b+=1440;var work=Math.max(0,b-a-br);$('worked').textContent=f(work);$('late').textContent=f(Math.max(0,a-540));$('ot').textContent=f(Math.max(0,work-540));return {work:work,late:Math.max(0,a-540),ot:Math.max(0,work-540)}}
function save(){var c=calc();if(!$('date').value||c==null){alert('Please enter date and both times.');return}R.push({id:Date.now(),date:$('date').value,worker:$('worker').value,inn:$('in').value,out:$('out').value,br:+$('br').value||0,worked:c.work,late:c.late,ot:c.ot});localStorage.setItem('ot_records',JSON.stringify(R));render()}
function render(){var now=new Date(),ym=now.toISOString().slice(0,7),rr=R.filter(function(x){return x.date.indexOf(ym)===0});$('days').textContent=rr.length;$('mh').textContent=f(rr.reduce(function(a,x){return a+x.worked},0));$('mo').textContent=f(rr.reduce(function(a,x){return a+x.ot},0));$('history').innerHTML=R.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(x){return '<div class="record"><b>'+esc(x.worker)+' · '+x.date+'</b><div class="muted">'+x.inn+' → '+x.out+' · Worked '+f(x.worked)+' · OT '+f(x.ot)+' · Break '+x.br+'m</div><div class="actions"><button class="secondary" onclick="edit('+x.id+')">Edit</button><button class="danger" onclick="del('+x.id+')">Delete</button></div></div>'}).join('')||'<p class="muted">No records yet.</p>'}
function del(id){R=R.filter(function(x){return x.id!==id});localStorage.setItem('ot_records',JSON.stringify(R));render()}function edit(id){var x=R.find(function(y){return y.id===id});if(!x)return;$('worker').value=x.worker;$('date').value=x.date;$('in').value=x.inn;$('out').value=x.out;$('br').value=x.br;del(id);calc();scrollTo(0,0)}
$('date').value=new Date().toISOString().slice(0,10);fill();calc();render();['in','out','br'].forEach(function(id){$(id).addEventListener('input',calc)});$('save').onclick=save;$('add').onclick=function(){var n=$('neww').value.trim();if(n&&!W.includes(n)){W.push(n);localStorage.setItem('ot_workers',JSON.stringify(W));fill();$('worker').value=n}$('neww').value=''};$('csv').onclick=function(){var s='Date,Worker,In,Out,Break,Worked,Late,OT\\n'+R.map(function(x){return [x.date,x.worker,x.inn,x.out,x.br,x.worked,x.late,x.ot].map(function(v){return '"'+String(v).replaceAll('"','""')+'"'}).join(',')}).join('\\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='worker-attendance.csv';a.click()};if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
